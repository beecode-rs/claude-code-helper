subject: resolvePlannerWindows
module: ./trigger-planner-model.js
subjectType: function
methods:
  __self__:
    terms:
      # Preset equivalence: first trigger 07:00 + work end 18:00 reproduces MAX_WINDOW_TRIGGER_PRESET.times
      # (see src/shared/trigger-model.ts), with 5h windows 07:00->12:00, 12:02->17:02, 17:05->22:05.
      - params:
          - firstTriggerMinutes: 420
            workEndMinutes: 1080
        result:
          - endMinutes: 720
            startMinutes: 420
            startTime: '07:00'
          - endMinutes: 1022
            startMinutes: 722
            startTime: '12:02'
          - endMinutes: 1325
            startMinutes: 1025
            startTime: '17:05'
      # Gap cadence: consecutive starts grow by +302, +303, +304, +305 minutes (nth gap = 301 + n).
      - params:
          - firstTriggerMinutes: 0
            workEndMinutes: 1440
        result:
          - endMinutes: 300
            startMinutes: 0
            startTime: '00:00'
          - endMinutes: 602
            startMinutes: 302
            startTime: '05:02'
          - endMinutes: 905
            startMinutes: 605
            startTime: '10:05'
          - endMinutes: 1209
            startMinutes: 909
            startTime: '15:09'
          - endMinutes: 1514
            startMinutes: 1214
            startTime: '20:14'
      # Windows stop at workEndMinutes: only starts before the limit are emitted;
      # the last window body may still extend past the work end (905 > 700).
      - params:
          - firstTriggerMinutes: 0
            workEndMinutes: 700
        result:
          - endMinutes: 300
            startMinutes: 0
            startTime: '00:00'
          - endMinutes: 602
            startMinutes: 302
            startTime: '05:02'
          - endMinutes: 905
            startMinutes: 605
            startTime: '10:05'
      # One window: the next start (1000 + 302) lands exactly on workEndMinutes and is excluded.
      - params:
          - firstTriggerMinutes: 1000
            workEndMinutes: 1302
        result:
          - endMinutes: 1300
            startMinutes: 1000
            startTime: '16:40'
      # Zero: a first trigger at work end yields no windows.
      - params:
          - firstTriggerMinutes: 1080
            workEndMinutes: 1080
        result: []
      # Zero: a first trigger after work end yields no windows.
      - params:
          - firstTriggerMinutes: 1200
            workEndMinutes: 1080
        result: []
      # Work end above 1440 is capped at 1440, and a window starting before midnight keeps its
      # true endMinutes past 1440 (midnight spill stays in the model; only the UI clips).
      - params:
          - firstTriggerMinutes: 1380
            workEndMinutes: 2000
        result:
          - endMinutes: 1680
            startMinutes: 1380
            startTime: '23:00'
