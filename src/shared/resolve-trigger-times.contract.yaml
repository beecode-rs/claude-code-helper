subject: resolveTriggerTimes
module: ./trigger-planner-model.js
subjectType: function
methods:
  __self__:
    terms:
      # Zero: no windows, no times.
      - params:
          - []
        result: []
      # One: a single window maps to its start time.
      - params:
          - - endMinutes: 1680
              startMinutes: 1380
              startTime: '23:00'
        result: ['23:00']
      # Many: window starts are mapped in order (preset windows -> MAX_WINDOW_TRIGGER_PRESET.times).
      - params:
          - - endMinutes: 720
              startMinutes: 420
              startTime: '07:00'
            - endMinutes: 1022
              startMinutes: 722
              startTime: '12:02'
            - endMinutes: 1325
              startMinutes: 1025
              startTime: '17:05'
        result: ['07:00', '12:02', '17:05']
