# Contract for SettingsService.sanitizeSettings, pinning the session-finished-sound
# key migration and the session-finished pulse duration.
#
# Sound: sessionFinishedSoundId wins when valid, the legacy idleSoundId
# migrates when the new key is absent or invalid, and the success default applies
# when neither resolves.
#
# Pulse: sessionFinishedPulseSeconds is how long the finished card keeps pulsing its
# border. Only a finite number survives; anything else (absent, string, NaN, null)
# falls back to the 10 second default. Valid numbers clamp into [0, 60] and round to
# whole seconds, so 0 (indicator off) and 60 are kept as-is while 90 saturates.
#
# The runner matches results with a full deep equal (no
# partial matching), so every term pins the complete sanitized settings object the
# empty raw record deterministically produces — every other absent field falls back
# to its default, and trackers/triggers/sshHosts come back empty because the record
# carries no legacy token fields either.
subject: SettingsService
module: ./settings-service.js
subjectType: class
constructor:
  # No constructor params and no own fields: a fresh instance compares as an empty object.
  terms:
    - params: []
      result: {}
methods:
  sanitizeSettings:
    terms:
      # Both keys valid: the new sessionFinishedSoundId wins over the legacy idleSoundId.
      - constructorParams: []
        params:
          - rawSettings:
              idleSoundId: beep
              sessionFinishedSoundId: ding
        result:
          isSchedulingEnabled: false
          isSessionsAutoRefreshPaused: false
          sessionFinishedPulseSeconds: 10
          sessionFinishedSoundId: ding
          sessionsRefreshIntervalSeconds: 5
          soundVolumePercent: 40
          sshHosts: []
          trackers: []
          triggers: []
          waitingSoundId: chime
      # Only the legacy key present: idleSoundId migrates into sessionFinishedSoundId.
      - constructorParams: []
        params:
          - rawSettings:
              idleSoundId: fanfare
        result:
          isSchedulingEnabled: false
          isSessionsAutoRefreshPaused: false
          sessionFinishedPulseSeconds: 10
          sessionFinishedSoundId: fanfare
          sessionsRefreshIntervalSeconds: 5
          soundVolumePercent: 40
          sshHosts: []
          trackers: []
          triggers: []
          waitingSoundId: chime
      # Neither key present (empty record): the success default.
      - constructorParams: []
        params:
          - rawSettings: {}
        result:
          isSchedulingEnabled: false
          isSessionsAutoRefreshPaused: false
          sessionFinishedPulseSeconds: 10
          sessionFinishedSoundId: success
          sessionsRefreshIntervalSeconds: 5
          soundVolumePercent: 40
          sshHosts: []
          trackers: []
          triggers: []
          waitingSoundId: chime
      # An unknown value in the new key falls through to a valid legacy key.
      - constructorParams: []
        params:
          - rawSettings:
              idleSoundId: ping
              sessionFinishedSoundId: not-a-sound
        result:
          isSchedulingEnabled: false
          isSessionsAutoRefreshPaused: false
          sessionFinishedPulseSeconds: 10
          sessionFinishedSoundId: ping
          sessionsRefreshIntervalSeconds: 5
          soundVolumePercent: 40
          sshHosts: []
          trackers: []
          triggers: []
          waitingSoundId: chime
      # Invalid values in both keys: the success default.
      - constructorParams: []
        params:
          - rawSettings:
              idleSoundId: true
              sessionFinishedSoundId: 42
        result:
          isSchedulingEnabled: false
          isSessionsAutoRefreshPaused: false
          sessionFinishedPulseSeconds: 10
          sessionFinishedSoundId: success
          sessionsRefreshIntervalSeconds: 5
          soundVolumePercent: 40
          sshHosts: []
          trackers: []
          triggers: []
          waitingSoundId: chime
      # Legacy 'none' is a valid sound id: a user who had the idle sound disabled
      # stays disabled rather than being reset to the default.
      - constructorParams: []
        params:
          - rawSettings:
              idleSoundId: none
        result:
          isSchedulingEnabled: false
          isSessionsAutoRefreshPaused: false
          sessionFinishedPulseSeconds: 10
          sessionFinishedSoundId: none
          sessionsRefreshIntervalSeconds: 5
          soundVolumePercent: 40
          sshHosts: []
          trackers: []
          triggers: []
          waitingSoundId: chime
      # A whole number inside the range is kept as the pulse duration.
      - constructorParams: []
        params:
          - rawSettings:
              sessionFinishedPulseSeconds: 25
        result:
          isSchedulingEnabled: false
          isSessionsAutoRefreshPaused: false
          sessionFinishedPulseSeconds: 25
          sessionFinishedSoundId: success
          sessionsRefreshIntervalSeconds: 5
          soundVolumePercent: 40
          sshHosts: []
          trackers: []
          triggers: []
          waitingSoundId: chime
      # Zero is a real choice (indicator off), not a missing value.
      - constructorParams: []
        params:
          - rawSettings:
              sessionFinishedPulseSeconds: 0
        result:
          isSchedulingEnabled: false
          isSessionsAutoRefreshPaused: false
          sessionFinishedPulseSeconds: 0
          sessionFinishedSoundId: success
          sessionsRefreshIntervalSeconds: 5
          soundVolumePercent: 40
          sshHosts: []
          trackers: []
          triggers: []
          waitingSoundId: chime
      # Below the minimum clamps up to zero.
      - constructorParams: []
        params:
          - rawSettings:
              sessionFinishedPulseSeconds: -5
        result:
          isSchedulingEnabled: false
          isSessionsAutoRefreshPaused: false
          sessionFinishedPulseSeconds: 0
          sessionFinishedSoundId: success
          sessionsRefreshIntervalSeconds: 5
          soundVolumePercent: 40
          sshHosts: []
          trackers: []
          triggers: []
          waitingSoundId: chime
      # Above the maximum clamps down to a minute.
      - constructorParams: []
        params:
          - rawSettings:
              sessionFinishedPulseSeconds: 90
        result:
          isSchedulingEnabled: false
          isSessionsAutoRefreshPaused: false
          sessionFinishedPulseSeconds: 60
          sessionFinishedSoundId: success
          sessionsRefreshIntervalSeconds: 5
          soundVolumePercent: 40
          sshHosts: []
          trackers: []
          triggers: []
          waitingSoundId: chime
      # A fractional duration rounds to whole seconds.
      - constructorParams: []
        params:
          - rawSettings:
              sessionFinishedPulseSeconds: 7.6
        result:
          isSchedulingEnabled: false
          isSessionsAutoRefreshPaused: false
          sessionFinishedPulseSeconds: 8
          sessionFinishedSoundId: success
          sessionsRefreshIntervalSeconds: 5
          soundVolumePercent: 40
          sshHosts: []
          trackers: []
          triggers: []
          waitingSoundId: chime
      # A non-number falls back to the default rather than clamping.
      - constructorParams: []
        params:
          - rawSettings:
              sessionFinishedPulseSeconds: '20'
        result:
          isSchedulingEnabled: false
          isSessionsAutoRefreshPaused: false
          sessionFinishedPulseSeconds: 10
          sessionFinishedSoundId: success
          sessionsRefreshIntervalSeconds: 5
          soundVolumePercent: 40
          sshHosts: []
          trackers: []
          triggers: []
          waitingSoundId: chime
